name: CI

on:
  push:
  pull_request:

jobs:
  extension:
    name: Extension, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: fiber-interop/ext-scope, path: ext-scope}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config, composer
          coverage: none
      - name: Build
        run: cd ext-scope && phpize && ./configure && make -j"$(nproc)"
      - name: PHPUnit against the extension
        run: |
          composer install --no-interaction --no-progress
          php -d extension="$PWD/ext-scope/modules/scope.so" vendor/bin/phpunit

  polyfill:
    name: Polyfill, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit (polyfill; the extension is not loaded)
        run: |
          php -r 'exit(extension_loaded("scope") ? 1 : 0);'
          vendor/bin/phpunit
